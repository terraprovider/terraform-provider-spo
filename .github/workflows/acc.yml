name: Acceptance Tests

# Runs the TF_ACC acceptance tests against a LIVE tenant, so it is gated to manual
# dispatch and a weekly schedule — never on PRs. Point it at a disposable dev
# tenant with no real data (the suite creates + destroys throwaway objects).
#
# Required repository configuration:
#   vars.ARM_TENANT_ID, vars.ARM_CLIENT_ID  - the test app (non-secret)
#   vars.SPO_TENANT_NAME                     - the SharePoint tenant name
#                                              (the {tenant} in {tenant}-admin.sharepoint.com)
#   an Entra federated credential on that app for this repo, subject
#   repo:terraprovider/terraform-provider-spo:ref:refs/heads/main (OIDC, no secret).
#
# NOTE: SharePoint rejects client-secret app-only tokens. Auth must be a certificate
# or OIDC workload-identity federation (both yield appidacr=2). The app needs the
# SharePoint Sites.FullControl.All application permission with admin consent.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1" # weekly, Monday 05:00 UTC

permissions:
  contents: read
  id-token: write # mint the GitHub OIDC token for federated auth

jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      TF_ACC: "1"
      ARM_USE_OIDC: "true"
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      SPO_TENANT_NAME: ${{ vars.SPO_TENANT_NAME }}
      # Optional: an existing site URL for the hub-site test. Unset -> it skips.
      SPO_ACC_SITE_URL: ${{ vars.SPO_ACC_SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Acceptance tests
        run: go test -run '^TestAcc' -parallel 4 -timeout 45m -v ./internal/provider/
